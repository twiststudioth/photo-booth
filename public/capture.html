<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ถ่ายรูป - Photo Booth</title>
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link rel="dns-prefetch" href="https://res.cloudinary.com">
  <link rel="stylesheet" href="/fonts/pridi.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <div id="loadingScreen" class="loading-screen">
      <div class="spinner"></div>
      <p>กำลังโหลด...</p>
    </div>

    <div id="captureScreen" style="display: none;">
      <header class="capture-header">
        <h1 id="eventTitle">ถ่ายรูป</h1>
        <div class="photo-counter">
          <span id="currentPhoto">1</span> / 3
        </div>
      </header>

      <div class="capture-content">
        <div class="camera-container">
          <video id="video" autoplay playsinline></video>
          <canvas id="canvas" style="display: none;"></canvas>
          
          <div id="countdown" class="countdown" style="display: none;">
            <div class="countdown-number">3</div>
          </div>
          
          <div id="cameraControls" class="camera-controls">
            <select id="cameraSelect" class="camera-select">
              <option value="">เลือกกล้อง...</option>
            </select>
          </div>
        </div>

        <div class="preview-container" id="previewContainer" style="display: none;">
          <img id="preview" alt="Preview">
          <div class="preview-actions">
            <button id="retakeBtn" class="btn btn-secondary btn-action">ถ่ายใหม่</button>
            <button id="nextBtn" class="btn btn-primary btn-action">ถัดไป →</button>
          </div>
        </div>

        <div class="capture-actions" id="captureActions">
          <button id="captureBtn" class="btn btn-primary btn-action">
            ถ่ายรูป
          </button>
        </div>

        <div class="thumbnails" id="thumbnails"></div>
      </div>
    </div>

    <div id="frameSelectionScreen" style="display: none;">
      <header class="capture-header">
        <h1>เลือกกรอบรูป</h1>
      </header>

      <div class="frame-selection-content">
        <div class="frames-grid-container">
          <div id="framesGridWithPreview" class="frames-grid-with-preview"></div>
        </div>

        <div class="frame-actions">
          <button id="backToPhotosBtn" class="btn btn-secondary btn-action">← กลับไปถ่ายใหม่</button>
          <button id="savePhotosBtn" class="btn btn-primary btn-action">บันทึกรูป</button>
        </div>
      </div>
    </div>

    <div id="successScreen" style="display: none;">
      <div class="success-message">
        <div class="success-icon">✓</div>
        <h2>บันทึกรูปสำเร็จ!</h2>
        <p>รูปของคุณถูกบันทึกเรียบร้อยแล้ว</p>
        <p class="success-note">คุณสามารถดูและดาวน์โหลดรูปได้ในแกลเลอรี่</p>
        <div class="button-group">
          <button id="viewGalleryBtn" class="btn btn-primary">ดูแกลเลอรี่</button>
          <button id="takeMoreBtn" class="btn btn-secondary">ถ่ายรูปอีก</button>
        </div>
      </div>
    </div>
    
    <footer class="app-footer">
      <div class="footer-content">
        <div class="footer-logo">
          <img src="https://res.cloudinary.com/djhs7rjth/image/upload/w_160,f_auto,q_auto:eco/v1778500960/logo_line_b_wbgwbn.png" alt="Twist Studio Logo" width="80" height="auto" loading="lazy">
        </div>
        <p class="footer-text">Powered by <a href="https://www.facebook.com/twist.studio.th" target="_blank" rel="noopener noreferrer">Twist Studio</a></p>
        <div class="footer-social">
          <a href="https://www.facebook.com/twist.studio.th" target="_blank" rel="noopener noreferrer" aria-label="Facebook" class="social-link">

            </svg>

        </div>
      </div>
    </footer>
  </div>

  <script src="/capture.js"></script>

</html>
