<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Photo Booth</title>
  <link href="https://fonts.googleapis.com/css2?family=Pridi:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="loginScreen" class="container">
    <div class="login-box">
      <h1>🔐 เข้าสู่ระบบผู้ดูแล</h1>
      <form id="loginForm">
        <div class="form-group">
          <label>ชื่อผู้ใช้</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>รหัสผ่าน</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
        <div id="loginError" class="error-message"></div>
      </form>
      <a href="/" class="back-link">← กลับหน้าแรก</a>
    </div>
  </div>

  <div id="adminPanel" class="container" style="display: none;">
    <header class="admin-header">
      <h1>📊 Admin Panel</h1>
      <button id="logoutBtn" class="btn btn-secondary">ออกจากระบบ</button>
    </header>

    <div class="admin-content">
      <div class="section">
        <div class="section-header">
          <h2>🎉 จัดการอีเว้นท์</h2>
          <button id="createEventBtn" class="btn btn-primary">+ สร้างอีเว้นท์ใหม่</button>
        </div>
        <div id="eventsList" class="events-grid"></div>
      </div>
    </div>
  </div>

  <!-- Create Event Modal -->
  <div id="createEventModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>สร้างอีเว้นท์ใหม่</h2>
        <button class="close-btn">&times;</button>
      </div>
      <form id="createEventForm">
        <div class="form-group">
          <label>ชื่ออีเว้นท์ *</label>
          <input type="text" id="eventName" required>
        </div>
        <div class="form-group">
          <label>Prefix ชื่อไฟล์ *</label>
          <input type="text" id="filePrefix" placeholder="EVENT" required>
          <small>ตัวอย่าง: EVENT_0001, EVENT_0002</small>
        </div>
        <div class="form-group">
          <label>โฟลเดอร์สำหรับอัพโหลด</label>
          <input type="text" id="uploadFolder" placeholder="default">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary cancel-btn">ยกเลิก</button>
          <button type="submit" class="btn btn-primary">สร้างอีเว้นท์</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Event Detail Modal -->
  <div id="eventDetailModal" class="modal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2 id="eventDetailTitle"></h2>
        <button class="close-btn">&times;</button>
      </div>
      <div class="event-detail-content">
        <div class="detail-section">
          <h3>📋 ข้อมูลอีเว้นท์</h3>
          <div id="eventInfo"></div>
        </div>

        <div class="detail-section">
          <h3>🔗 ลิงก์สำหรับแชร์</h3>
          <div class="link-section">
            <div class="link-item">
              <label>📸 ลิงก์ถ่ายรูป:</label>
              <div class="link-input-group">
                <input type="text" id="captureLink" readonly class="link-input">
                <button id="copyCaptureLink" class="btn btn-secondary btn-small">📋 คัดลอก</button>
              </div>
            </div>
            <div class="link-item">
              <label>🖼️ ลิงก์ดูรูปทั้งหมด:</label>
              <div class="link-input-group">
                <input type="text" id="galleryLink" readonly class="link-input">
                <button id="copyGalleryLink" class="btn btn-secondary btn-small">📋 คัดลอก</button>
              </div>
            </div>
          </div>
        </div>
        
        
        <div class="detail-section">
          <h3>🖼️ กรอบรูป</h3>
          <div class="frame-upload">
            <input type="file" id="frameUpload" accept="image/*" style="display: none;">
            <button id="uploadFrameBtn" class="btn btn-primary">+ อัพโหลดกรอบ</button>
          </div>
          <div id="framesList" class="frames-grid"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="deleteEventBtn" class="btn btn-danger">ลบอีเว้นท์</button>
      </div>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
